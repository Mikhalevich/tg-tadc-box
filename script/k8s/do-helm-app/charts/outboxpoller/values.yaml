# Default values for bot.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 3

image:
  repository: "registry.digitalocean.com/tadc-box-registry/outboxpoller"
  tag: "0.1.0"

resources:
  requests:
    memory: "32Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "200m"

bot:
  token: "telegram bot api token"

postgres:
  connStr: "host=postgres-service port=5432 user=bot password=bot dbname=bot sslmode=disable"
