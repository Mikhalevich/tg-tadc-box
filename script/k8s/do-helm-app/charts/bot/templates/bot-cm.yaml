apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-cm
data:
  config-bot.yaml: |
    log_level: "info"
    tracing:
      endpoint: "jaeger-service:4318"
      service_name: "box-bot"
    bot:
      token: {{ .Values.bot.token }}
      name: {{ .Values.bot.name }}
      webhook_token: {{ .Values.bot.webhook_token }}
    postgres:
      connection: {{ .Values.postgres.connStr }}
    box_reward_percent:
      common:
        legendary: 1
        epic: 5
        rare: 20
      rare:
        legendary: 4
        epic: 10
        rare: 100
      epic:
        legendary: 20
        epic: 100
        rare: 100
      legendary:
        legendary: 100
        epic: 100
        rare: 100
    box_costs:
      common:
        amount: 0
      rare:
        amount: 25
      epic:
        amount: 125
      legendary:
        amount: 500
    box_wait_period:
      common: 3h
      rare: 6h
      epic: 12h
      legendary: 24h
    bonus_box_attempts:
      common: 10
      rare: 10
      epic: 10
    abstraction_costs:
      common: 1
      rare: 5
      epic: 25
      legendary: 100
