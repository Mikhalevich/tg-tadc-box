log_level: "info"
tracing:
  endpoint: "jaeger:4318"
  service_name: "box-bot"
bot:
  token: "bot_token"
  name: "bot_name"
  webhook_token: "webhook_token or empty if running in polling mode"
postgres:
  connection: "host=postgres port=5432 user=bot password=bot dbname=bot sslmode=disable"
box_reward_percent:
  common:
    legendary: 1
    epic: 5
    rare: 20
  rare:
    legendary: 4
    epic: 10
    rare: 100
  epic:
    legendary: 20
    epic: 100
    rare: 100
  legendary:
    legendary: 100
    epic: 100
    rare: 100
box_costs:
  common:
    amount: 0
  rare:
    amount: 25
  epic:
    amount: 125
  legendary:
    amount: 500
box_wait_period:
  common: 10s
  rare: 10s
  epic: 10s
  legendary: 10s
bonus_box_attempts:
  common: 3
  rare: 3
  epic: 3
abstraction_costs:
  common: 1
  rare: 5
  epic: 25
  legendary: 100
